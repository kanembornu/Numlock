<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Numlock Dashboard</title>

    <meta
      http-equiv="refresh"
      content="1; url=https://script.google.com/macros/s/AKfycbxyll_HUHO9_YmUL6QuJ93ZeIgO8Asy_LcsqTaK2C2dK8nesZXAzPkkSEhbwZKxkX6q/exec"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      .container {
        width: min(420px, calc(100% - 32px));
        padding: 32px;
        text-align: center;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #cbd5e1;
        line-height: 1.6;
      }

      .loader {
        width: 42px;
        height: 42px;
        margin: 0 auto 24px;
        border: 4px solid #334155;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .button {
        display: inline-block;
        padding: 12px 20px;
        color: #0f172a;
        font-weight: 700;
        text-decoration: none;
        background: #38bdf8;
        border-radius: 10px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="loader"></div>

      <h1>Numlock Dashboard</h1>

      <p>Redirecting...</p>

      <a
        class="button"
        href="https://script.google.com/macros/s/AKfycbxyll_HUHO9_YmUL6QuJ93ZeIgO8Asy_LcsqTaK2C2dK8nesZXAzPkkSEhbwZKxkX6q/exec"
      >
        Buka Numlock Dashboard
      </a>
    </main>

    <script>
      const appUrl =
        'https://script.google.com/macros/s/AKfycbxyll_HUHO9_YmUL6QuJ93ZeIgO8Asy_LcsqTaK2C2dK8nesZXAzPkkSEhbwZKxkX6q/exec';

      window.setTimeout(function () {
        window.location.replace(appUrl);
      }, 800);
    </script>
  </body>
</html>
